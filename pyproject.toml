[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cislunar-orbits"
version = "0.1.0"
description = "Earth-Moon CR3BP periodic orbits (Lyapunov, halo, NRHO) and invariant manifolds, validated against the JPL periodic-orbit catalog"
authors = [{ name = "Badr Elsayed" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["plotly>=5.18", "streamlit>=1.30"]

[tool.setuptools.packages.find]
include = ["cr3bp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
